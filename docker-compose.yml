services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: midiamix-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - midiamix-net

  postgres:
    image: postgres:16-alpine
    container_name: midiamix-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - midiamix-net

volumes:
  pgdata:

networks:
  midiamix-net:
    driver: bridge